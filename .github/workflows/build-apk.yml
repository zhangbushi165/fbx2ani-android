name: 构建安卓播放器 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'urhoapp/**'
      - 'bin/Data/**'
      - '.github/workflows/**'

concurrency:
  group: apk-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK + NDK (arm64)
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          cmake-version: 3.22.1

      - name: 构建精简 SDK 目录（规避旧 AGP 无法解析预装 SDK 元数据的崩溃）
        run: |
          # AGP 4.2 内置的老 sdk-repository 库无法解析 runner 预装 SDK 里含新版
          # 组件的元数据（如 "android-34" 的 XML），会抛 NumberFormatException "34x"。
          # 于是用 sdkmanager 新建一个只含所需旧组件的干净 SDK，并让整个构建用它。
          SM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          CLEAN="$HOME/csdk"
          mkdir -p "$CLEAN"
          yes | "$SM" --sdk_root="$CLEAN" --install \
            "platform-tools" \
            "platforms;android-30" \
            "build-tools;30.0.2" \
            "cmake;3.22.1" \
            "ndk;21.3.6528147" >/dev/null 2>&1 || true
          echo "== 精简 SDK 已装组件 =="
          ls "$CLEAN"
          echo "ANDROID_HOME=$CLEAN" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$CLEAN" >> "$GITHUB_ENV"

      - name: 安装 Ruby/rake（生成 UrhoApp 工程用）
        run: |
          sudo gem install rake --no-document

      - name: 克隆 Urho3D v1.8.1
        run: |
          git clone --depth 1 --branch 1.9.0 --single-branch \
            https://github.com/urho3d/Urho3D.git $HOME/Urho3D

      - name: 生成官方 App 工程骨架 AniPlayer
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          cd "$HOME/Urho3D"
          PLATFORM=android rake new[AniPlayer,$HOME]

      - name: 注入播放器源码与资源
        run: |
          # 清掉骨架自带的 AniPlayer.cpp/.h（含其 main 宏），避免与我们的 main 冲突
          rm -f "$HOME/AniPlayer/app/src/main/cpp/AniPlayer.cpp"
          rm -f "$HOME/AniPlayer/app/src/main/cpp/AniPlayer.h"
          cp urhoapp/UrhoApp.h   "$HOME/AniPlayer/app/src/main/cpp/UrhoApp.h"
          cp urhoapp/UrhoApp.cpp "$HOME/AniPlayer/app/src/main/cpp/UrhoApp.cpp"
          rm -rf "$HOME/AniPlayer/bin/Data"
          cp -r bin/Data "$HOME/AniPlayer/bin/Data"
          rm -rf "$HOME/AniPlayer/bin/CoreData"
          cp -r "$HOME/Urho3D/bin/CoreData" "$HOME/AniPlayer/bin/CoreData"
          # 兼容当前 AGP：setBuildStagingDirectory() 方法已移除；该属性需 File 类型，故用 file() 包装 String
          sed -i 's/setBuildStagingDirectory(buildStagingDir)/buildStagingDirectory = file(buildStagingDir)/' \
            "$HOME/AniPlayer/app/build.gradle.kts"
          # 修复库版本号：rake 生成时因其提前跑 ./gradlew aarVersion 会因 Bintray 解析失败
          # 拿到空版本，导致依赖 "urho3d-lib-static(-debug):" 缺版本号。统一写成明确的 1.9.0，
          # 与下方发布库时 GRADLE_PROJECT_VERSION=1.9.0 对齐。
          sed -i -e 's/urho3d-lib-static-debug:/urho3d-lib-static-debug:1.9.0/' \
                 -e 's/urho3d-lib-static:/urho3d-lib-static:1.9.0/' \
                 "$HOME/AniPlayer/app/build.gradle.kts"
          echo "=== 库依赖引用检查（应为 1.9.0）==="
          grep -n "urho3d-lib-static" "$HOME/AniPlayer/app/build.gradle.kts"

      - name: 写入低内存 Gradle 配置（防 OOM）与 JDK17 兼容参数
        run: |
          # 低内存，防 OOM
          echo "org.gradle.jvmargs=-Xmx2300m -XX:MaxMetaspaceSize=512m" >> "$HOME/Urho3D/gradle.properties"
          echo "org.gradle.workers.max=2" >> "$HOME/Urho3D/gradle.properties"
          echo "org.gradle.jvmargs=-Xmx2300m -XX:MaxMetaspaceSize=512m" >> "$HOME/AniPlayer/gradle.properties"
          echo "org.gradle.workers.max=2" >> "$HOME/AniPlayer/gradle.properties"
          # Urho3D 1.9.0 用的老版 Kotlin 1.4.10 在 JDK17 下访问 sun.nio.ch 被拒，需放行
          for f in "$HOME/Urho3D/gradle.properties" "$HOME/AniPlayer/gradle.properties"; do
            echo '# JDK17 兼容：放行 Kotlin 编译器访问 sun.nio.ch' >> "$f"
            echo 'org.gradle.jvmargs=-Xmx2300m -XX:MaxMetaspaceSize=512m --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED' >> "$f"
          done
          # 关闭 Kotlin 内嵌编译器守护进程对模块系统的高要求（改用编译守护）
          echo "kotlin.compiler.execution.strategy=in-process" >> "$HOME/AniPlayer/gradle.properties" 2>/dev/null || true

      - name: 移除废弃 Bintray 插件与文档 artifact（避免下架依赖 / 无效 doc target）
        run: |
          cd "$HOME/Urho3D"
          # 1) 删掉插件 id 声明（根 build.gradle.kts 的 apply false + urho3d-lib 的 apply）
          sed -i -e '/id("com.jfrog.bintray")/d' \
                 -e '/apply plugin.*com.jfrog.bintray/d' \
                 build.gradle.kts android/urho3d-lib/build.gradle.kts
          # 2) 删除 urho3d-lib 里跨行的 bintray {} 配置块
          awk '/^bintray \{/,/^}/ {next} {print}' android/urho3d-lib/build.gradle.kts > _lib.tmp && \
            mv _lib.tmp android/urho3d-lib/build.gradle.kts
          # 3) 移除 documentation 相关发布，否则 publishToMavenLocal 会调用 cmake --target doc
          #    （该 doc target 未随库配置，ninja 会报 unknown target 'doc' 导致失败）
          sed -i -e '/artifact(tasks\["documentationZip"\])/d' \
                 -e '/register<Zip>("documentationZip")/,/^    }/d' \
                 -e '/register<Exec>("makeDoc")/,/^    }/d' \
                 -e '/register<Task>("makeDocConfigurer")/,/^    }/d' \
                 android/urho3d-lib/build.gradle.kts
          echo "=== bintray 残留检查（应为空）==="
          grep -rn "bintray" build.gradle.kts android/urho3d-lib/build.gradle.kts || echo "（已清除）"
          echo "=== documentation/makeDoc 残留检查（应为空）==="
          grep -rn "makeDoc\|documentationZip" android/urho3d-lib/build.gradle.kts || echo "（已清除）"

      - name: 编译并发布 urho3d-lib 到 Maven Local
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          cd "$HOME/Urho3D"
          # 指定明确版本，避免浅克隆（无 tag）时 determineVersion() 取到 "Unversioned"，
          # 保证与 app 侧引用一致。只发布 urho3d-lib 库（AAR），跳过官方 launcher-app 的 build
          GRADLE_PROJECT_VERSION=1.9.0 PLATFORM=android URHO3D_SAMPLES=0 URHO3D_TOOLS=0 \
            ./gradlew :android:urho3d-lib:publishToMavenLocal --no-daemon -q
          # 确认发布产物落地（应能看到 io/urho3d/urho3d-lib-static-debug/1.9.0/）
          echo "=== Maven Local 发布检查 ==="
          ls "$HOME/.m2/repository/io/urho3d/urho3d-lib-static-debug/1.9.0/" 2>/dev/null || \
            ls "$HOME/.m2/repository/io/urho3d/urho3d-lib-static-debug/"

      - name: 构建调试 APK
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          cd "$HOME/AniPlayer"
          ./gradlew assembleDebug --no-daemon

      - name: 收集 APK 路径
        run: |
          find "$HOME/AniPlayer" -name '*.apk' -type f
          echo "APK_DIR=$(find "$HOME/AniPlayer" -name '*.apk' -type f -exec dirname {} \; | head -1)" >> "$GITHUB_ENV"

      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ani-viewer-apk
          path: |
            ${{ env.APK_DIR }}/*.apk
          if-no-files-found: error

      - name: 发布到 GitHub Release 便于手机下载
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apkfile=$(find "$HOME/AniPlayer" -name '*.apk' -type f | head -1)
          echo "APK: $apkfile"
          tag="ani-viewer-$(date +%Y%m%d-%H%M)"
          gh release create "$tag" "$apkfile" \
            --repo "${{ github.repository }}" \
            --title "Ani 播放器 $tag" \
            --notes "Urho3D 骨骼动画查看器（.ani 播放）。安装后打开即可看到走路动画，点下方按钮切换骨骼线框。" >/dev/null 2>&1 || echo "release create may fail, will attach to latest"
          # 若上面失败（如 tag 已存在），附加到最新 release
          latest=$(gh release list --repo "${{ github.repository }}" --limit 1 --json tagName --jq '.[0].tagName')
          gh release upload "$latest" "$apkfile" --repo "${{ github.repository }}" --clobber